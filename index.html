<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAVE! FACTORY — Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'UnitySans';
    src:url('./UnitySans-Basic.ttf') format('truetype');
    font-weight:400 700;
    font-display:swap;
  }
  @font-face{
    font-family:'Ermilov';
    src:url('./Ermilov-bold.otf') format('opentype');
    font-weight:700;
    font-display:swap;
  }
  :root{
    --bg:#0a0a0c; --panel:#131318; --panel2:#18181f; --line:rgba(255,255,255,0.1);
    --text:#f0efe9; --muted:#8b8c94; --accent:#39ff14; --live:#c084fc; --dj:#60a5fa;
    --c-depo:#ff6b4a; --c-pav:#4ad9ff; --c-garden:#9eff4a; --c-bb:#c24aff;
    --c-angar:#ffd24a; --c-aud:#ff4a8f; --c-new:#5c7aff;
  }
  *{box-sizing:border-box;}
  button, input, select, textarea{font-family:inherit;}
  body{
    margin:0; font-family:'UnitySans', 'Space Grotesk', system-ui, sans-serif; color:var(--text);
    background:var(--bg);
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; top:0; left:0; width:100%; z-index:-1;
    height:100vh; height:100svh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(57,255,20,0.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(74,217,255,0.05), transparent 60%),
      linear-gradient(rgba(6,6,8,0.2), rgba(6,6,8,0.35)),
      url('https://static-image-2.s3.us-west-1.amazonaws.com/blog_images/REJ07610+2.png') right bottom / contain no-repeat;
  }
  .display{font-family:'Ermilov','Anton', sans-serif; text-transform:uppercase; letter-spacing:.01em;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 16px 60px;}

  header{
    position:sticky; top:0; z-index:10; background:rgba(10,10,12,0.85); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:0 16px 14px;
  }
  .headtop{position:relative; margin-bottom:12px;}
  .headtop-right{
    display:flex; align-items:center; gap:8px; justify-content:flex-end;
    position:absolute; right:10px; bottom:40%; z-index:2;
  }
  h1{
    font-size:clamp(15px,5.2vw,32px); margin:0;
    color:var(--accent);
    white-space:nowrap; min-width:0; flex:0 1 auto;
    font-family:'Ermilov','Anton',sans-serif; text-transform:uppercase; letter-spacing:.01em;
  }
  .logo-wrap{overflow:hidden; width:100%; margin-right:-16px; height:clamp(70px,20vw,140px);}
  .logo-img{width:100%; height:100%; object-fit:cover; object-position:50% 65%; display:block;}
  .clock{font-size:10px; color:var(--text); font-family:monospace; white-space:nowrap; background:rgba(10,10,12,0.6); padding:4px 8px; border-radius:6px;}
  .daytabs{display:flex; background:var(--panel2); border-radius:8px; padding:3px; gap:3px; flex:none;}
  .daytab{
    font-family:'Ermilov','Anton',sans-serif; font-size:12px; letter-spacing:.03em; border:none; background:transparent;
    color:var(--muted); padding:6px 12px; cursor:pointer; border-radius:5px; text-transform:uppercase;
  }
  .daytab.active{background:var(--accent); color:#0a0a0c;}
  @media (max-width:360px){
    .clock{display:none;}
    .daytab{padding:6px 9px; font-size:11px;}
  }

  .filters{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center;
    margin-top:-48px; position:relative; z-index:2;
    background:linear-gradient(to top, rgba(10,10,12,0.85), transparent);
    padding-top:24px;
  }
  .venues{display:flex; flex-wrap:wrap; gap:6px;}
  .vbtn{
    font-size:12px; padding:4px 8px; border-radius:99px; border:1px solid var(--line);
    background:rgba(19,19,24,0.5); color:var(--muted); cursor:pointer;
    font-family:'Ermilov','Anton',sans-serif;
  }
  .vbtn.active{font-weight:600;}
  .pastbtn{
    font-size:12px; padding:4px 8px; border-radius:99px; border:1px solid var(--line);
    background:rgba(19,19,24,0.5); color:var(--muted); cursor:pointer;
    font-family:'Ermilov','Anton',sans-serif;
  }
  .pastbtn.on{background:rgba(57,255,20,0.18); border-color:var(--accent); color:var(--accent);}

  .legend{display:flex; align-items:center; gap:12px; font-size:12px; color:var(--muted); margin:16px 0; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .legend::-webkit-scrollbar{display:none;}
  .legend span{white-space:nowrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:2px;}

  .live-panel{
    border:2px solid var(--accent); border-radius:10px; padding:18px;
    background:rgba(10,10,12,0.88);
    box-shadow:0 0 24px rgba(57,255,20,0.25), inset 0 0 30px rgba(57,255,20,0.04);
    margin-bottom:16px; position:relative; overflow:hidden;
  }
  .live-panel::before{
    content:''; position:absolute; inset:-50%; background-image:repeating-linear-gradient(-45deg, rgba(57,255,20,0.05) 0 40px, transparent 40px 100px);
    animation:slide 8s ease-in-out infinite;
  }
  .live-panel > *{position:relative; z-index:1;}
  @keyframes slide{0%,100%{transform:translateX(-25px);}50%{transform:translateX(25px);}}
  .live-badge{
    display:inline-flex; align-items:center; gap:7px; background:transparent; color:var(--accent);
    border:1px solid var(--accent); font-family:'Ermilov','Anton',sans-serif;
    padding:5px 14px; border-radius:99px; font-size:14px; letter-spacing:.02em; margin-bottom:12px;
  }
  .live-dot{width:7px; height:7px; border-radius:50%; background:#ff2b2b; animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .slot{border:1px solid var(--line); border-radius:10px; padding:16px; background:rgba(19,19,24,0.5); backdrop-filter:blur(6px); margin-bottom:14px;}
  .slot.past{opacity:.45; background:rgba(0,0,0,0.3);}
  .slot .time{font-family:'Ermilov','Anton',sans-serif; font-size:19px; color:var(--muted); margin-bottom:10px;}

  .grid3{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .card{
    border-left:3px solid #888; padding:8px 12px; border-radius:0 6px 6px 0; background:rgba(255,255,255,0.04);
    cursor:pointer; transition:background .15s; position:relative;
  }
  .card:hover{background:rgba(255,255,255,0.09);}
  .card.starred{background:rgba(57,255,20,0.07);}
  .card .venue{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:3px; padding-right:30px; font-family:'Ermilov','Anton',sans-serif;}
  .card .artist{font-weight:600; font-size:13.5px; line-height:1.25; padding-right:30px;}
  .typeicon{width:12px; height:12px; flex:none; border-radius:50%;}
  .typeicon.live{background:var(--live); box-shadow:0 0 5px var(--live);}
  .typeicon.dj{background:var(--dj);}
  .starbtn{
    position:absolute; top:50%; right:10px; transform:translateY(-50%); background:none; border:none; cursor:pointer;
    font-size:22px; line-height:1; color:var(--line); padding:2px; z-index:2;
  }
  .starbtn:hover{color:var(--accent);}
  .starbtn.on{color:var(--accent);}
  .modal-star{position:absolute; top:50%; right:16px; transform:translateY(-50%); font-size:24px;}

  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal{background:var(--panel2); border:1px solid var(--line); border-radius:10px; max-width:400px; width:100%; padding:22px; position:relative; overflow:hidden;}
  .modal-decor{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    overflow:hidden;
  }
  .modal-decor img{
    position:absolute; opacity:.4; filter:grayscale(0.15);
  }
  .modal-head, .modal .desc{position:relative; z-index:1;}
  .modal h3{margin:0 0 6px; font-family:'Ermilov','Anton',sans-serif; font-size:22px;}
  .modal .sub{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .modal .desc{font-size:13px; color:var(--muted); font-style:italic;}
  .modal .close{position:absolute; margin-left:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .closebtn{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; line-height:1;}
  .closebtn:hover{color:var(--text);}

  .hidden{display:none !important;}

  footer{
    margin-top:32px; border-top:1px solid var(--line);
    background:rgba(10,10,12,0.6); backdrop-filter:blur(8px);
    padding:28px 16px 32px; position:relative; overflow:hidden;
  }
  .footer-corner{position:absolute; opacity:.4; filter:grayscale(0.15); pointer-events:none;}
  footer .thanks{
    text-align:center; font-family:'Ermilov','Anton', sans-serif; font-size:15px;
    letter-spacing:.05em; color:var(--accent); margin-bottom:20px;
  }
  .partner-logos{
    display:flex; justify-content:center; align-items:center;
    gap:2rem; flex-wrap:wrap; padding:.5rem 0;
  }
  .partner-logo{
    max-height:48px; max-width:150px; min-height:28px; min-width:60px;
    width:auto; height:auto; object-fit:contain;
    opacity:.75; filter:brightness(0.95) grayscale(0.15);
    transition:opacity .25s ease, transform .25s ease, filter .25s ease;
  }
  .partner-logo:hover{
    opacity:1; transform:scale(1.05); filter:brightness(1.1) grayscale(0);
  }
  @media (max-width:640px){
    .partner-logos{gap:1.25rem;}
    .partner-logo{max-height:36px; max-width:110px;}
  }
</style>

</head>
<body>

<header>
  <div class="headtop">
    <div class="logo-wrap"><img src="https://static-image-2.s3.us-west-1.amazonaws.com/BRAVE+FESTIVAL_schedule_2026_2_2.png" alt="BRAVE! FACTORY" class="logo-img"></div>
    <div class="headtop-right">
      <span class="clock" id="clock"></span>
      <div class="daytabs">
        <button class="daytab active" data-day="sat">SAT 13</button>

      </div>
    </div>

  <div class="filters">
    <div class="venues" id="venues"></div>
  </div>
</header>

<div class="wrap">
  <div class="legend">
    <span><span class="typeicon live"></span>Live</span>

    <div style="display:flex; gap:8px; margin-left:auto; flex:none; white-space:nowrap;">
      <button class="pastbtn" id="favToggle" style="white-space:nowrap;">☆ My picks</button>
      <button class="pastbtn" id="pastToggle" style="white-space:nowrap;">Show past</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <div class="modal-decor" id="modalDecor"></div>
    <div class="modal-head">
      <div>
        <h3 id="mArtist"></h3>
        <div class="sub" id="mSub"></div>
      </div>
    </div>
    <button class="starbtn modal-star" id="mStar" aria-label="Toggle favorite">☆</button>
    <div class="desc" id="mDesc"></div>
  </div>
</div>

<footer>
  <img class="footer-corner" src="https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%97%D0%BD%D0%B0%D0%BA+2.png" style="top:-10px; left:-10px; width:70px; transform:rotate(-12deg);" alt="">
  <img class="footer-corner" src="https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D1%82%D1%80%D1%83%D0%B1%D0%B0+2.png" style="top:-15px; right:-15px; width:90px; transform:rotate(10deg);" alt="">
  <img class="footer-corner" src="https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%B3%D0%B0%D0%B8%CC%86%D0%BA%D0%B8+2.png" style="bottom:-5px; left:-5px; width:55px; transform:rotate(18deg);" alt="">
  <img class="footer-corner" src="https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%B8%CC%86%D0%BD%D0%B5%D1%80+2.png" style="bottom:-10px; right:-10px; width:80px; transform:rotate(-8deg);" alt="">
  <div class="thanks" style="position:relative; z-index:1;">✨ HOPE YOU HAD A GREAT TIME ✨</div>
</footer>

<script>
/* TEST MODE: sat = today, sun = tomorrow — for live real-time testing. Change back to real festival dates before launch. */
const DAY_DATES = { sat: '2026-08-13', sun: '2026-08-14' };

const VENUES = ['ALL','Depo','Pavilion 4','Garden','Black Box','Angar','Audience','New One'];
const VENUE_COLOR = {
  'ALL':'#39ff14',
  'Depo':'#ff6b4a','Pavilion 4':'#4ad9ff','Garden':'#22c55e','Black Box':'#c24aff',
  'Angar':'#ffd24a','Audience':'#ff4a8f','New One':'#5c7aff'
};

const RAW = {
  sat: [
    ['13:00','Depo','Lisovskyi'],['16:00','Depo','Unai Trotti'],
    ['19:00','Depo','DUST - live (Trippsy & Tumosa)'],['20:00','Depo','Shults.Sashaa'],
    ['17:00','Pavilion 4','vesnavoseny - live'],['18:00','Pavilion 4','Sheetel - live'],
    ['19:00','Pavilion 4','Gertz Theatre - live'],['20:00','Pavilion 4','C.A.R. (UK) - live'],
    ['21:00','Pavilion 4','Si Process - live'],
    ['13:00','Garden','Gapon'],['15:30','Garden','Kinnota - live'],['16:30','Garden','Tik Tu - live'],
    ['17:30','Garden','Nota Yanvarska'],['19:00','Garden','K not K (RO) - live'],
    ['20:00','Garden','Blooms Corda - live'],['21:00','Garden','Seba Korecky with NOTA CLÜB - live'],
    ['15:00','Black Box','Monotronique'],['17:00','Black Box','Nizhna - live'],
    ['18:00','Black Box','Ponura'],['20:00','Black Box','Batu'],
    ['15:00','Angar','Katia Stieber'],['17:00','Angar','Serge Jazzmate & Bellis'],
    ['21:00','Angar','Mezerg (FR) - live'],
    ['18:30','Audience','AVC - live'],['19:30','Audience','Ohm Hourani (CA)'],
    ['13:00','New One','Bambu'],['16:00','New One','J.Richards (USA)'],
  ],
  sun: [
    ['13:00','Depo','Karine'],['16:00','Depo','Igor Glushko & Roman K'],['19:00','Depo','Marco Shuttle (IT)'],
    ['17:00','Pavilion 4','Yan Shypula - live'],['18:00','Pavilion 4','Heavenphetamine (JP) - live'],
    ['19:00','Pavilion 4','Sigmund Friends - live'],['20:00','Pavilion 4','Sarathy Korwar Quartet (UK) - live'],
    ['21:00','Pavilion 4','Ready in LED - live'],
    ['13:00','Garden','Wieloroman'],['15:30','Garden','Patrice Scott'],
    ['18:30','Garden','Wallace (UK)'],['21:00','Garden','Seba Koretsky'],
    ['15:00','Black Box','Borys'],['18:30','Black Box','Bogdan Zaiets - live'],['19:30','Black Box','Dj Masda'],
    ['15:00','Angar','Recid & Oles'],['17:30','Angar','Andrey Sirotkin - live'],
    ['18:30','Angar','Anthony Rother - live'],['20:00','Angar','Anna Haleta & Alex Savage'],
    ['19:30','Audience','iO (Mulen) b2b Cheise'],
    ['14:00','New One','T.Fain (Vinaya)'],['17:30','New One','Thongwor - live'],['18:30','New One','Sweely (FR) - live'],
  ]
};

function buildData(){
  const out = {};
  Object.keys(RAW).forEach(day=>{
    out[day] = RAW[day].map(([time,venue,raw])=>{
      const isLive = /-\s*live/i.test(raw);
      const artist = raw.replace(/\s*-\s*live/i,'').trim();
      return {time, venue, artist, type:isLive?'live':'dj'};
    });
  });
  return out;
}
const DATA = buildData();

let state = { day:'sat', venue:'ALL', hidePast:true, modalEvent:null, favOnly:false };

/* --- favorites (starred artists), persisted in localStorage --- */
const FAV_KEY = 'brave_factory_favs';
function loadFavs(){
  try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); }
  catch(e){ return new Set(); }
}
function saveFavs(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }catch(e){}
}
const favs = loadFavs();
function favId(day, ev){ return `${day}::${ev.time}::${ev.venue}::${ev.artist}`; }
function toggleFav(day, ev){
  const id = favId(day, ev);
  if(favs.has(id)) favs.delete(id); else favs.add(id);
  saveFavs();
}

function eventDate(day, time){
  const [y,mo,d] = DAY_DATES[day].split('-').map(Number);
  const [h,mi] = time.split(':').map(Number);
  const dt = new Date(); dt.setFullYear(y,mo-1,d); dt.setHours(h,mi,0,0);
  return dt;
}

function sameVenueSorted(day, venue){
  return DATA[day].filter(e=>e.venue===venue).sort((a,b)=>a.time.localeCompare(b.time));
}

function endTimeStr(time){
  let [h,m] = time.split(':').map(Number);
  m += 75; h += Math.floor(m/60); m%=60;
  if(h>22){h=22;m=0;}
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function getEnd(ev, day){
  const list = sameVenueSorted(day, ev.venue);
  const idx = list.findIndex(e=>e.time===ev.time && e.artist===ev.artist);
  const next = list[idx+1];
  return next ? eventDate(day, next.time) : eventDate(day, endTimeStr(ev.time));
}

function getRange(ev, day){
  const end = getEnd(ev, day);
  const h = String(end.getHours()).padStart(2,'0');
  const m = String(end.getMinutes()).padStart(2,'0');
  return `${ev.time}–${h}:${m}`;
}

function getStatus(ev, day, now){
  const start = eventDate(day, ev.time);
  const end = getEnd(ev, day);
  if(now>=start && now<end) return 'current';
  if(now>=end) return 'past';
  return 'future';
}

function typeIconHTML(type){
  return `<span class="typeicon ${type}"></span>`;
}

function renderVenues(){
  const el = document.getElementById('venues');
  el.innerHTML = VENUES.map(v=>{
    const c = VENUE_COLOR[v];
    const active = v===state.venue;
    const style = active
      ? `background:${c}; border-color:${c}; color:#0a0a0c;`
      : `border-color:${c}55; color:${c};`;
    return `<button class="vbtn ${active?'active':''}" data-v="${v}" style="${style}">${v}</button>`;
  }).join('');
  el.querySelectorAll('.vbtn').forEach(b=>b.addEventListener('click',()=>{
    state.venue = b.dataset.v; render();
  }));
}

const DECOR_IMG = {
  znak: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%97%D0%BD%D0%B0%D0%BA+2.png",
  balka: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%A0%D0%B6%D0%B0%D0%B2%D0%B0+%D0%B1%D0%B0%D0%BB%D0%BA%D0%B0+2.png",
  kamin: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%BA%D0%B0%D0%BC%D1%96%D0%BD%D1%8C+%D1%80%D0%B6%D0%B0%D0%B2%D0%B8%D0%B8%CC%86+2.png",
  truba: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D1%82%D1%80%D1%83%D0%B1%D0%B0+2.png",
  granit: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%93%D1%80%D0%B0%D0%BD%D1%96%D1%82+%D0%9A%D0%B0%D0%BC%D1%96%D0%BD%D1%8C+2.png",
  container: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%B8%CC%86%D0%BD%D0%B5%D1%80+2.png",
  containerBlue: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%B8%CC%86%D0%BD%D0%B5%D1%80+%D1%81%D0%B8%D0%BD%D1%96%D0%B8%CC%86+2.png",
  gaiky: "https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%B3%D0%B0%D0%B8%CC%86%D0%BA%D0%B8+2.png"
};

// warm the browser cache immediately so modal images appear instantly on open
Object.values(DECOR_IMG).forEach(src=>{ const img = new Image(); img.src = src; });

// each decor set = array of {src, style}. gaiky+truba kept together as a pair.
const DECOR_SETS = [
  [{src:DECOR_IMG.truba, style:"top:-20px; right:0px; width:130px; transform:rotate(15deg);"}],
  [{src:DECOR_IMG.container, style:"top:20px; right:10px; width:110px; transform:rotate(-8deg);"}],
  [{src:DECOR_IMG.containerBlue, style:"top:10px; right:20px; width:100px; transform:rotate(10deg); opacity:.6;"}],
  [{src:DECOR_IMG.znak, style:"top:10px; right:20px; width:90px; transform:rotate(-10deg);"}],
  [{src:DECOR_IMG.balka, style:"top:15px; right:0px; width:140px; transform:rotate(6deg);"}],
  [{src:DECOR_IMG.kamin, style:"top:-5px; right:30px; width:80px; transform:rotate(18deg);"}],
  [{src:DECOR_IMG.granit, style:"top:20px; right:20px; width:95px; transform:rotate(-14deg);"}],
  [
    {src:DECOR_IMG.truba, style:"top:-20px; right:10px; width:110px; transform:rotate(15deg);"},
    {src:DECOR_IMG.gaiky, style:"bottom:10px; right:100px; width:55px; transform:rotate(20deg);"}
  ]
];

function renderModalDecor(){
  const set = DECOR_SETS[Math.floor(Math.random()*DECOR_SETS.length)];
  document.getElementById('modalDecor').innerHTML = set.map(img=>
    `<img src="${img.src}" style="${img.style}" alt="">`
  ).join('');
}

function openModal(ev){
  state.modalEvent = ev;
  document.getElementById('mArtist').textContent = ev.artist;
  document.getElementById('mSub').innerHTML = `<span>${getRange(ev,state.day)}</span><span>·</span><span>${ev.venue}</span>${typeIconHTML(ev.type)}`;
  document.getElementById('mDesc').textContent = ev.type==='live' ? 'Live set.' : 'DJ set.';
  const isFav = favs.has(favId(state.day, ev));
  const mStar = document.getElementById('mStar');
  mStar.textContent = isFav ? '★' : '☆';
  mStar.classList.toggle('on', isFav);
  renderModalDecor();
  document.getElementById('modalBg').classList.remove('hidden');
}

function cardHTML(ev){
  const id = favId(state.day, ev);
  const isFav = favs.has(id);
  return `<div class="card ${isFav?'starred':''}" style="border-left-color:${VENUE_COLOR[ev.venue]}" data-time="${ev.time}" data-venue="${ev.venue}" data-artist="${ev.artist.replace(/"/g,'&quot;')}">
    <button class="starbtn ${isFav?'on':''}" data-star="1" aria-label="Toggle favorite">${isFav ? '★' : '☆'}</button>
    <div class="venue">${ev.venue} ${typeIconHTML(ev.type)}</div>
    <div class="artist">${ev.artist}</div>
  </div>`;
}

function attachCardHandlers(container){
  container.querySelectorAll('.card').forEach(card=>{
    const ev = DATA[state.day].find(e=>e.time===card.dataset.time && e.venue===card.dataset.venue && e.artist===card.dataset.artist);
    if(!ev) return;
    card.querySelector('.starbtn').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleFav(state.day, ev);
      render();
    });
    card.addEventListener('click', ()=> openModal(ev));
  });
}

function render(){
  renderVenues();
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  let venueEvents = DATA[state.day].filter(e=> state.venue==='ALL' || e.venue===state.venue);
  if(state.favOnly) venueEvents = venueEvents.filter(e=> favs.has(favId(state.day,e)));
  let events = state.hidePast ? venueEvents.filter(e=> getStatus(e,state.day,now) !== 'past') : venueEvents;
  // never show an empty screen: if hiding past wiped out everything (e.g. whole day already finished), fall back to showing it all
  if(!events.length && venueEvents.length) events = venueEvents;

  const grouped = {};
  events.forEach(e=>{ (grouped[e.time] = grouped[e.time]||[]).push(e); });
  const times = Object.keys(grouped).sort();

  const currentEvents = times.flatMap(t=> grouped[t].filter(e=> getStatus(e,state.day,now)==='current'));
  const restTimes = times.filter(t=> !grouped[t].every(e=> getStatus(e,state.day,now)==='current'));

  let html = '';

  if(currentEvents.length){
    html += `<div class="live-panel">
      <div class="live-badge"><span class="live-dot"></span>HAPPENING NOW</div>
      <div class="grid3">${currentEvents.map(cardHTML).join('')}</div>
    </div>`;
  }

  restTimes.forEach(t=>{
    const evs = grouped[t].filter(e=> getStatus(e,state.day,now) !== 'current');
    if(!evs.length) return;
    const allPast = evs.every(e=> getStatus(e,state.day,now)==='past');
    html += `<div class="slot ${allPast?'past':''}">
      <div class="time">${t}</div>
      <div class="grid3">${evs.map(cardHTML).join('')}</div>
    </div>`;
  });

  if(!venueEvents.length){
    html = state.favOnly
      ? `<div style="text-align:center; color:var(--muted); padding:40px;">No picks yet — tap ☆ on a set to save it here.</div>`
      : `<div style="text-align:center; color:var(--muted); padding:40px;">No sets match this filter.</div>`;
  }

  const content = document.getElementById('content');
  content.innerHTML = html;
  attachCardHandlers(content);
}

document.querySelectorAll('.daytab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.daytab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.day = btn.dataset.day;
    state.venue = 'ALL';
    render();
  });
});

document.getElementById('pastToggle').addEventListener('click', (e)=>{
  state.hidePast = !state.hidePast;
  e.target.textContent = state.hidePast ? 'Show past' : 'Hide past';
  e.target.classList.toggle('on', !state.hidePast);
  render();
});

document.getElementById('favToggle').addEventListener('click', (e)=>{
  state.favOnly = !state.favOnly;
  e.target.textContent = state.favOnly ? '★ My picks' : '☆ My picks';
  e.target.classList.toggle('on', state.favOnly);
  render();
});

document.getElementById('mStar').addEventListener('click', ()=>{
  if(!state.modalEvent) return;
  toggleFav(state.day, state.modalEvent);
  const isFav = favs.has(favId(state.day, state.modalEvent));
  const mStar = document.getElementById('mStar');
  mStar.textContent = isFav ? '★' : '☆';
  mStar.classList.toggle('on', isFav);
  render();
});

document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') e.target.classList.add('hidden'); });

setInterval(render, 60000);
render();
</script>
</body>
</html>
