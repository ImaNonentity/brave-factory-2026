<style>
  @font-face{
    font-family:'UnitySans';
    src:url('./UnitySans-Basic.ttf') format('truetype');
    font-weight:400 700;
    font-display:swap;
  }
  @font-face{
    font-family:'Ermilov';
    src:url('./Ermilov-bold.otf') format('opentype');
    font-weight:700;
    font-display:swap;
  }
  :root{
    --bg:#0a0a0c; --panel:#131318; --panel2:#18181f; --line:rgba(255,255,255,0.1);
    --text:#f0efe9; --muted:#8b8c94; --accent:#8eff03; --live:#c084fc; --dj:#60a5fa;
    --c-depo:#ff6b4a; --c-pav:#4ad9ff; --c-garden:#9eff4a; --c-bb:#c24aff;
    --c-angar:#ffd24a; --c-aud:#ff4a8f; --c-new:#5c7aff;
  }
  *{box-sizing:border-box;}
  button, input, select, textarea{font-family:inherit;}
  body{
    margin:0; font-family:'UnitySans', 'Space Grotesk', system-ui, sans-serif; color:var(--text);
    background:var(--bg);
    min-height:100vh; min-height:100dvh;
    position:relative;
    display:flex; flex-direction:column;
  }
  body::before{
    content:'';
    position:fixed; top:var(--header-h, 0px); left:0; width:100%; z-index:-1;
    height:calc(var(--vh-lock, 100svh) - var(--header-h, 0px));
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(142,255,3,0.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(74,217,255,0.05), transparent 60%),
      linear-gradient(rgba(6,6,8,0.2), rgba(6,6,8,0.35)),
      url('https://static-image-2.s3.us-west-1.amazonaws.com/blog_images/REJ07610+2.png') right bottom / cover no-repeat;
  }
  .display{font-family:'Ermilov','Anton', sans-serif; text-transform:uppercase; letter-spacing:.01em;}
  .wrap{max-width:1100px; margin:0 auto; padding:0 16px 60px;}

  header{
    position:sticky; top:0; z-index:10; background:rgba(10,10,12,0.85); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:0 16px 14px;
  }
  .headtop{position:relative; margin-bottom:12px;}
  .headtop-right{
    display:flex; align-items:center; gap:8px; justify-content:flex-end;
    position:absolute; right:10px; bottom:40%; z-index:2;
  }
  h1{
    font-size:clamp(15px,5.2vw,32px); margin:0;
    color:var(--accent);
    white-space:nowrap; min-width:0; flex:0 1 auto;
    font-family:'Ermilov','Anton',sans-serif; text-transform:uppercase; letter-spacing:.01em;
  }
  .logo-wrap{overflow:hidden; width:calc(100% + 32px); margin-left:-16px; height:clamp(70px,20vw,140px);}
  .logo-img{width:100%; height:100%; object-fit:cover; object-position:0% 65%; transform:scaleX(1.15); transform-origin:left center; display:block;}
  .clock{font-size:10px; color:var(--text); font-family:monospace; white-space:nowrap; background:rgba(10,10,12,0.6); padding:4px 8px; border-radius:6px;}
  .daytabs{display:flex; background:var(--panel2); border-radius:8px; padding:3px; gap:3px; flex:none;}
  .daytab{
    font-family:'Ermilov','Anton',sans-serif; font-size:12px; letter-spacing:.03em; border:none; background:transparent;
    color:var(--muted); padding:6px 12px; cursor:pointer; border-radius:5px; text-transform:uppercase;
  }
  .daytab.active{background:var(--accent); color:#0a0a0c;}
  @media (max-width:360px){
    .clock{display:none;}
    .daytab{padding:6px 9px; font-size:11px;}
  }

  .filters{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; align-items:center;
    margin-top:-48px; position:relative; z-index:2;
    background:linear-gradient(to top, rgba(10,10,12,0.85), transparent);
    padding-top:24px;
  }
  .venues{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;}
  .venues .vbtn{width:100%;}
  .vbtn{
    font-size:12px; padding:4px 8px; border-radius:99px; border:1px solid var(--line);
    background:rgba(19,19,24,0.5); color:var(--muted); cursor:pointer;
    font-family:'Ermilov','Anton',sans-serif;
  }
  .vbtn.active{font-weight:600;}
  .pastbtn{
    font-size:12px; padding:4px 8px; border-radius:99px; border:1px solid var(--line);
    background:rgba(19,19,24,0.5); color:var(--muted); cursor:pointer;
    font-family:'Ermilov','Anton',sans-serif;
  }
  .pastbtn.on{background:rgba(142,255,3,0.18); border-color:var(--accent); color:var(--accent);}

  .legend{display:flex; align-items:center; gap:12px; font-size:12px; color:var(--muted); margin:16px 0; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .legend::-webkit-scrollbar{display:none;}
  .legend span{white-space:nowrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:2px;}

  .live-panel{
    border:2px solid var(--accent); border-radius:10px; padding:18px;
    background:rgba(10,10,12,0.88);
    animation:glowpulse 3s ease-in-out infinite;
    margin-bottom:16px; position:relative; overflow:hidden;
  }
  .live-panel > *{position:relative; z-index:1;}
  .live-panel .footer-corner{z-index:0;}
  @keyframes glowpulse{
    0%,100%{box-shadow:0 0 24px rgba(142,255,3,0.25), inset 0 0 30px rgba(142,255,3,0.04);}
    50%{box-shadow:0 0 36px rgba(142,255,3,0.4), inset 0 0 40px rgba(142,255,3,0.08);}
  }
  .live-badge{
    display:inline-flex; align-items:center; gap:7px; background:transparent; color:var(--accent);
    border:1px solid var(--accent); font-family:'Ermilov','Anton',sans-serif;
    padding:5px 14px; border-radius:99px; font-size:14px; letter-spacing:.02em; margin-bottom:12px;
  }
  .live-dot{width:7px; height:7px; border-radius:50%; background:#ff2b2b; animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .slot{border:1px solid var(--line); border-radius:10px; padding:16px; background:rgba(19,19,24,0.5); backdrop-filter:blur(6px); margin-bottom:14px;}
  .slot.past{opacity:.45; background:rgba(0,0,0,0.3);}
  .slot .time{font-family:'Ermilov','Anton',sans-serif; font-size:19px; color:var(--muted); margin-bottom:10px;}

  .grid3{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .card{
    border-left:3px solid #888; padding:8px 12px; border-radius:0 6px 6px 0; background:rgba(255,255,255,0.04);
    cursor:pointer; transition:background .15s; position:relative; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .card:hover{background:rgba(255,255,255,0.09);}
  .card.starred{background:rgba(142,255,3,0.07);}
  .card .venue{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:3px; padding-right:30px; font-family:'Ermilov','Anton',sans-serif;}
  .card .artist{font-weight:600; font-size:13.5px; line-height:1.25; padding-right:30px;}
  .typeicon{width:12px; height:12px; flex:none; border-radius:50%;}
  .typeicon.live{background:var(--live); box-shadow:0 0 5px var(--live);}
  .typeicon.dj{background:var(--dj);}
  .starbtn{
    position:absolute; top:50%; right:10px; transform:translateY(-50%); background:none; border:none; cursor:pointer;
    font-size:22px; line-height:1; color:var(--line); padding:2px; z-index:2;
  }
  .starbtn:hover{color:var(--accent);}
  .starbtn.on{color:var(--accent);}
  .modal-star{position:absolute; top:50%; right:16px; transform:translateY(-50%); font-size:24px;}

  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal{background:var(--panel2); border:1px solid var(--line); border-radius:10px; max-width:400px; width:100%; padding:22px; position:relative; overflow:hidden;}
  .modal-decor{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    overflow:hidden;
  }
  .modal-decor img{
    position:absolute; opacity:.4; filter:grayscale(0.15);
  }
  .modal-head, .modal .desc{position:relative; z-index:1;}
  .modal h3{margin:0 0 6px; font-family:'Ermilov','Anton',sans-serif; font-size:22px;}
  .modal .sub{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .modal .desc{font-size:13px; color:var(--muted); font-style:italic;}
  .linkchip{
    font-size:12px; padding:6px 12px; border-radius:99px; border:1px solid var(--line);
    background:rgba(255,255,255,0.06); color:var(--muted); text-decoration:none; font-weight:500;
    transition:background .15s, color .15s;
  }
  .linkchip:hover{background:rgba(255,255,255,0.12); color:var(--text);}
  .modal .close{position:absolute; margin-left:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .closebtn{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; line-height:1;}
  .closebtn:hover{color:var(--text);}

  .hidden{display:none !important;}

  footer{
    margin-top:auto; border-top:1px solid var(--line);
    background:rgba(10,10,12,0.6); backdrop-filter:blur(8px);
    padding:28px 16px 32px; position:relative; overflow:hidden;
  }
  .footer-corner{position:absolute; opacity:.4; filter:grayscale(0.15); pointer-events:none;}
  footer .thanks{
    text-align:center; font-family:'Ermilov','Anton', sans-serif; font-size:15px;
    letter-spacing:.05em; color:var(--accent); margin-bottom:20px;
  }
  .donate-banner{
    position:relative; z-index:1; display:block; max-width:420px; margin:0 auto;
    text-align:center; text-decoration:none;
    border:1px solid var(--accent); border-radius:10px; padding:14px 16px;
    background:rgba(142,255,3,0.06);
    transition:background .2s;
  }
  .donate-banner:hover{background:rgba(142,255,3,0.14);}
  .donate-title{
    font-family:'Ermilov','Anton',sans-serif; font-size:13px; color:var(--text);
    letter-spacing:.02em; line-height:1.4; margin-bottom:6px;
  }
  .donate-cta{
    font-family:'Ermilov','Anton',sans-serif; font-size:13px; color:var(--accent);
    font-weight:700; letter-spacing:.05em;
  }
  .partner-logos{
    display:flex; justify-content:center; align-items:center;
    gap:2rem; flex-wrap:wrap; padding:.5rem 0;
  }
  .partner-logo{
    max-height:48px; max-width:150px; min-height:28px; min-width:60px;
    width:auto; height:auto; object-fit:contain;
    opacity:.75; filter:brightness(0.95) grayscale(0.15);
    transition:opacity .25s ease, transform .25s ease, filter .25s ease;
  }
  .partner-logo:hover{
    opacity:1; transform:scale(1.05); filter:brightness(1.1) grayscale(0);
  }
  @media (max-width:640px){
    .partner-logos{gap:1.25rem;}
    .partner-logo{max-height:36px; max-width:110px;}
  }
</style>

<script>
/* lock background height against mobile browser chrome show/hide jank */
(function(){
  let lastWidth = window.innerWidth;
  function lockHeight(){
    document.documentElement.style.setProperty('--vh-lock', window.innerHeight + 'px');
    lastWidth = window.innerWidth;
  }
  function lockHeaderHeight(){
    const h = document.querySelector('header');
    if(h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
  }
  lockHeight();
  lockHeaderHeight();
  window.addEventListener('resize', function(){
    // only re-measure on a genuine width change (orientation/device change),
    // not on height-only changes caused by the address bar collapsing/expanding
    if(window.innerWidth !== lastWidth){ lockHeight(); lockHeaderHeight(); }
  });
  window.addEventListener('load', lockHeaderHeight);
})();
</script>

function normalizeArtist(name){
  return name.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s*-\s*live/gi,'')
    .replace(/\([^)]*\)/g,'')
    .replace(/\bb2b\b/gi,' ')
    .replace(/[.&]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// softer normalization for duo/b2b matching: keeps content inside parens
// (e.g. member names like "(Mulen)", "(Trippsy & Tumosa)"), just drops the
// parens characters themselves, so nothing gets silently discarded.
function normalizeForDuo(name){
  return name.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s*-\s*live/gi,'')
    .replace(/[()]/g,' ')
    .replace(/\bb2b\b/gi,' ')
    .replace(/[.&]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function lookupArtistInfo(artist){
  const norm = normalizeArtist(artist);
  if(ARTIST_INFO[norm]) return ARTIST_INFO[norm];
  // fuzzy: try matching by first word/key fragment
  const keys = Object.keys(ARTIST_INFO);
  const hit = keys.find(k => norm.includes(k) || k.includes(norm));
  return hit ? ARTIST_INFO[hit] : null;
}

// known b2b / duo / collab bookings: schedule entry -> [{label, key}, ...]
// keys here are written in normalizeForDuo() form (parens content kept, just unwrapped)
const DUO_MAP = {
  'dust lt trippsy tumosa':[{label:'Tumosa', key:'tumosa'},{label:'Trippsy', key:'trippsy'}],
  'seba korecky with nota club':[{label:'Seba Korecky', key:'seba korecky'},{label:'NOTA CLÜB', key:'nota club'}],
  'serge jazzmate bellis':[{label:'Serge Jazzmate', key:'serge jazzmate'},{label:'Bèllis', key:'bellis'}],
  'io mulen cheise':[{label:'iO (Mulen)', key:'io mulen'},{label:'Cheise', key:'cheise'}],
  'acid pauli de viken arman fr':[{label:'Acid Pauli', key:'acid pauli'},{label:'Viken Arman', key:'viken arman'}]
};

function lookupArtists(artist){
  const normDuo = normalizeForDuo(artist);
  const duoKey = Object.keys(DUO_MAP).find(k => normDuo.includes(k) || k.includes(normDuo));
  if(duoKey){
    return DUO_MAP[duoKey]
      .map(m => ({label:m.label, info:ARTIST_INFO[m.key]}))
      .filter(m => m.info);
  }
  const info = lookupArtistInfo(artist);
  return info ? [{label:null, info}] : [];
}

function buildData(){
  const out = {};
  Object.keys(RAW).forEach(day=>{
    out[day] = RAW[day].map(([time,venue,raw])=>{
      const isLive = /-\s*live/i.test(raw);
      const artist = raw.replace(/\s*-\s*live/i,'').trim();
      return {time, venue, artist, type:isLive?'live':'dj'};
    });
  });
  return out;
}

const FAV_KEY = 'brave_factory_favs';
function loadFavs(){
  try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); }
  catch(e){ return new Set(); }
}
function saveFavs(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }catch(e){}
}
const favs = loadFavs();
function favId(day, ev){ return `${day}::${ev.time}::${ev.venue}::${ev.artist}`; }
function toggleFav(day, ev){
  const id = favId(day, ev);
  if(favs.has(id)) favs.delete(id); else favs.add(id);
  saveFavs();
}

function eventDate(day, time){
  const [y,mo,d] = DAY_DATES[day].split('-').map(Number);
  const [h,mi] = time.split(':').map(Number);
  const dt = new Date(); dt.setFullYear(y,mo-1,d); dt.setHours(h,mi,0,0);
  return dt;
}

function sameVenueSorted(day, venue){
  return DATA[day].filter(e=>e.venue===venue).sort((a,b)=>a.time.localeCompare(b.time));
}

function endTimeStr(time){
  return '22:00';
}

function getEnd(ev, day){
  const list = sameVenueSorted(day, ev.venue);
  const idx = list.findIndex(e=>e.time===ev.time && e.artist===ev.artist);
  const next = list[idx+1];
  return next ? eventDate(day, next.time) : eventDate(day, endTimeStr(ev.time));
}

function getRange(ev, day){
  const end = getEnd(ev, day);
  const h = String(end.getHours()).padStart(2,'0');
  const m = String(end.getMinutes()).padStart(2,'0');
  return `${ev.time}–${h}:${m}`;
}

function getStatus(ev, day, now){
  const start = eventDate(day, ev.time);
  const end = getEnd(ev, day);
  if(now>=start && now<end) return 'current';
  if(now>=end) return 'past';
  return 'future';
}

    if(m.info.ig) chips += `<a href="${m.info.ig}" target="_blank" rel="noopener" class="linkchip ig">Instagram</a>`;

function attachCardHandlers(container){
  container.querySelectorAll('.card').forEach(card=>{
    const ev = DATA[state.day].find(e=>e.time===card.dataset.time && e.venue===card.dataset.venue && e.artist===card.dataset.artist);
    if(!ev) return;
    card.querySelector('.starbtn').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleFav(state.day, ev);
      render();
    });
    card.addEventListener('click', ()=> openModal(ev));
  });
}

function render(){
  renderVenues();
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  let venueEvents = DATA[state.day].filter(e=> state.venue==='ALL' || e.venue===state.venue);
  if(state.favOnly) venueEvents = venueEvents.filter(e=> favs.has(favId(state.day,e)));
  let events = state.hidePast ? venueEvents.filter(e=> getStatus(e,state.day,now) !== 'past') : venueEvents;
  // never show an empty screen: if hiding past wiped out everything (e.g. whole day already finished), fall back to showing it all
  if(!events.length && venueEvents.length) events = venueEvents;

  const grouped = {};
  events.forEach(e=>{ (grouped[e.time] = grouped[e.time]||[]).push(e); });
  const times = Object.keys(grouped).sort();

  const currentEvents = times.flatMap(t=> grouped[t].filter(e=> getStatus(e,state.day,now)==='current'));
  const restTimes = times.filter(t=> !grouped[t].every(e=> getStatus(e,state.day,now)==='current'));

  let html = '';

  if(currentEvents.length){
    html += `<div class="live-panel">
      <img class="footer-corner" src="https://static-image-2.s3.us-west-1.amazonaws.com/temp/%D0%A0%D0%B6%D0%B0%D0%B2%D0%B0+%D0%B1%D0%B0%D0%BB%D0%BA%D0%B0+2.png" style="top:-15px; right:-15px; width:150px; transform:rotate(8deg);" alt="">

      <div class="live-badge"><span class="live-dot"></span>HAPPENING NOW</div>
      <div class="grid3">${currentEvents.map(cardHTML).join('')}</div>
    </div>`;
  }

  restTimes.forEach(t=>{
    const evs = grouped[t].filter(e=> getStatus(e,state.day,now) !== 'current');
    if(!evs.length) return;
    const allPast = evs.every(e=> getStatus(e,state.day,now)==='past');
    html += `<div class="slot ${allPast?'past':''}">
      <div class="time">${t}</div>
      <div class="grid3">${evs.map(cardHTML).join('')}</div>
    </div>`;
  });

  if(!venueEvents.length){
    html = state.favOnly
      ? `<div style="text-align:center; color:var(--muted); padding:40px;">No picks yet — tap ☆ on a set to save it here.</div>`
      : `<div style="text-align:center; color:var(--muted); padding:40px;">No sets match this filter.</div>`;
  }

  const content = document.getElementById('content');
  content.innerHTML = html;
  attachCardHandlers(content);
}

document.querySelectorAll('.daytab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.daytab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.day = btn.dataset.day;
    state.venue = 'ALL';
    render();
  });
});

document.getElementById('pastToggle').addEventListener('click', (e)=>{
  state.hidePast = !state.hidePast;
  e.target.textContent = state.hidePast ? 'Show past' : 'Hide past';
  e.target.classList.toggle('on', !state.hidePast);
  render();
});

document.getElementById('favToggle').addEventListener('click', (e)=>{
  state.favOnly = !state.favOnly;
  e.target.textContent = state.favOnly ? '★ My picks' : '☆ My picks';
  e.target.classList.toggle('on', state.favOnly);
  render();
});

document.getElementById('mStar').addEventListener('click', ()=>{
  if(!state.modalEvent) return;
  toggleFav(state.day, state.modalEvent);
  const isFav = favs.has(favId(state.day, state.modalEvent));
  const mStar = document.getElementById('mStar');
  mStar.textContent = isFav ? '★' : '☆';
  mStar.classList.toggle('on', isFav);
  render();
});

document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') e.target.classList.add('hidden'); });

setInterval(render, 60000);
render();
</script>
</body>
</html>
